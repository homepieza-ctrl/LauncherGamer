name: Compilar Mi Launcher (todo en uno)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Crear proyecto completo
        run: |
          set -e
          mkdir -p app app/src/main app/src/main/java/com/mylauncher/gamer app/src/main/res/drawable app/src/main/res/drawable-nodpi app/src/main/res/layout app/src/main/res/mipmap-anydpi-v26 app/src/main/res/raw app/src/main/res/values app/src/main/res/values-v28 gradle/wrapper tools
          cat > .gitignore <<'EOF_FILE'
          .gradle/
          build/
          local.properties
          .idea/
          *.iml
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.mylauncher.gamer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mylauncher.gamer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Permite ver las apps instaladas que tienen icono de lanzamiento -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Mi Launcher"
                  android:theme="@style/AppTheme">

                  <!-- Siempre de costado -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Permite usarlo como pantalla de inicio (launcher) -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/mylauncher/gamer/MainActivity.kt <<'EOF_FILE'
          package com.mylauncher.gamer

          import android.content.Intent
          import android.graphics.RenderEffect
          import android.graphics.Shader
          import android.media.MediaPlayer
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.util.DisplayMetrics
          import android.view.InputDevice
          import android.view.KeyEvent
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.LinearSmoothScroller
          import androidx.recyclerview.widget.RecyclerView
          import kotlin.math.abs

          enum class Tab { RECENT, FAV, ALL }

          class MainActivity : AppCompatActivity() {

              private lateinit var games: MutableList<Game>
              private var tab = Tab.RECENT
              private var sel = 0
              private var pendingPkg: String? = null
              private var pendingName = ""
              private var hatHeld = 0

              private lateinit var rv: RecyclerView
              private lateinit var lm: LinearLayoutManager
              private lateinit var adapter: GameAdapter
              private lateinit var bgCover: ImageView
              private lateinit var tvName: TextView
              private lateinit var btnPlay: TextView
              private lateinit var btnFav: TextView
              private lateinit var btnCover: TextView
              private lateinit var btnDel: TextView
              private lateinit var battery: TextView

              private val pickCover = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  val pkg = pendingPkg
                  pendingPkg = null
                  if (pkg == null || uri == null) return@registerForActivityResult
                  val path = Store.saveCover(this, uri, pkg)
                  if (path == null) { toast("No se pudo leer la imagen"); return@registerForActivityResult }
                  val ex = games.find { it.pkg == pkg }
                  if (ex != null) { Store.deleteFile(ex.cover); ex.cover = path }
                  else games.add(Game(pkg, pendingName, path, false, System.currentTimeMillis()))
                  Store.save(this, games)
                  tab = Tab.RECENT; sel = 0
                  styleTabs(); refresh()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  immersive()
                  games = Store.load(this)
                  if (savedInstanceState == null) playStartup()
                  val btnSound = findViewById<TextView>(R.id.btnSound)
                  btnSound.alpha = if (soundOn()) 1f else 0.35f
                  btnSound.setOnClickListener {
                      val on = !soundOn()
                      getSharedPreferences("cfg", 0).edit().putBoolean("sound", on).apply()
                      btnSound.alpha = if (on) 1f else 0.35f
                      if (on) playStartup()
                  }

                  bgCover = findViewById(R.id.bgCover)
                  tvName = findViewById(R.id.tvName)
                  btnPlay = findViewById(R.id.btnPlay)
                  btnFav = findViewById(R.id.btnFav)
                  btnCover = findViewById(R.id.btnCover)
                  btnDel = findViewById(R.id.btnDel)
                  battery = findViewById(R.id.battery)
                  rv = findViewById(R.id.rv)

                  if (Build.VERSION.SDK_INT >= 31) {
                      bgCover.setRenderEffect(RenderEffect.createBlurEffect(40f, 40f, Shader.TileMode.CLAMP))
                  }

                  lm = LinearLayoutManager(this, LinearLayoutManager.HORIZONTAL, false)
                  adapter = GameAdapter { pos -> onCardClick(pos) }
                  rv.layoutManager = lm
                  rv.adapter = adapter
                  rv.itemAnimator = null
                  rv.post {
                      val pad = (rv.width - dp(121)) / 2
                      rv.setPadding(pad, 0, pad, 0)
                      refresh()
                  }
                  rv.addOnScrollListener(object : RecyclerView.OnScrollListener() {
                      override fun onScrollStateChanged(r: RecyclerView, state: Int) {
                          if (state != RecyclerView.SCROLL_STATE_IDLE) return
                          val c = r.width / 2
                          var best = -1; var bd = Int.MAX_VALUE
                          for (i in 0 until r.childCount) {
                              val v = r.getChildAt(i)
                              val d = abs((v.left + v.right) / 2 - c)
                              if (d < bd) { bd = d; best = r.getChildAdapterPosition(v) }
                          }
                          if (best >= 0 && best != sel) select(best)
                          else if (best >= 0 && bd > 4) centerOn(best)
                      }
                  })

                  findViewById<View>(R.id.tabRecent).setOnClickListener { setTab(Tab.RECENT) }
                  findViewById<View>(R.id.tabFav).setOnClickListener { setTab(Tab.FAV) }
                  findViewById<View>(R.id.tabAll).setOnClickListener { setTab(Tab.ALL) }
                  btnPlay.setOnClickListener { current()?.let { launch(it) } }
                  btnFav.setOnClickListener {
                      current()?.let { it.fav = !it.fav; Store.save(this, games); if (tab == Tab.FAV) refresh() else updateInfo() }
                  }
                  btnCover.setOnClickListener {
                      current()?.let { pendingPkg = it.pkg; pendingName = it.name; pickCover.launch("image/*") }
                  }
                  btnDel.setOnClickListener { current()?.let { confirmDelete(it) } }

                  // Como launcher: el boton Atras no hace nada
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {}
                  })
                  styleTabs()
              }

              override fun onResume() {
                  super.onResume()
                  val bm = getSystemService(BATTERY_SERVICE) as BatteryManager
                  battery.text = "▮ ${bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)}%"
                  if (::adapter.isInitialized) refresh()
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (intent.action == Intent.ACTION_MAIN) { sel = 0; refresh() }  // boton Inicio
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) immersive()
              }

              private fun immersive() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              // ---------- Datos ----------
              private fun visible(): List<Game> = when (tab) {
                  Tab.FAV -> games.filter { it.fav }
                  Tab.ALL -> games.sortedBy { it.name.lowercase() }
                  Tab.RECENT -> games.sortedByDescending { it.last }
              }

              private fun current(): Game? = visible().getOrNull(sel)

              private fun refresh() {
                  val l = visible()
                  sel = sel.coerceIn(0, l.size)
                  adapter.items = l
                  adapter.selected = sel
                  adapter.notifyDataSetChanged()
                  updateInfo()
                  rv.post { centerOn(sel) }
              }

              private fun updateInfo() {
                  val g = current()
                  val has = g != null
                  btnPlay.visibility = if (has) View.VISIBLE else View.GONE
                  btnFav.visibility = if (has) View.VISIBLE else View.GONE
                  btnCover.visibility = if (has) View.VISIBLE else View.GONE
                  btnDel.visibility = if (has) View.VISIBLE else View.GONE
                  if (g != null) {
                      tvName.text = g.name
                      btnFav.text = if (g.fav) "★ Quitar favorito" else "☆ Favorito"
                      bgCover.setImageBitmap(Store.bitmap(g.cover))
                  } else {
                      tvName.text = if (tab == Tab.FAV) "Aún no tienes favoritos" else "Pulsa + para agregar un juego"
                      bgCover.setImageBitmap(null)
                  }
              }

              // ---------- Seleccion / movimiento ----------
              private fun select(p: Int, center: Boolean = true) {
                  val old = sel
                  sel = p.coerceIn(0, visible().size)
                  adapter.selected = sel
                  if (old < adapter.itemCount) adapter.notifyItemChanged(old)
                  adapter.notifyItemChanged(sel)
                  updateInfo()
                  if (center) centerOn(sel)
              }

              private fun move(d: Int) = select(sel + d)

              private fun centerOn(pos: Int) {
                  if (pos < 0 || pos >= adapter.itemCount) return
                  val s = object : LinearSmoothScroller(this) {
                      override fun calculateDtToFit(vs: Int, ve: Int, bs: Int, be: Int, snap: Int) =
                          (bs + (be - bs) / 2) - (vs + (ve - vs) / 2)
                      override fun calculateSpeedPerPixel(m: DisplayMetrics) = 60f / m.densityDpi
                  }
                  s.targetPosition = pos
                  lm.startSmoothScroll(s)
              }

              private fun onCardClick(pos: Int) {
                  if (pos == RecyclerView.NO_POSITION) return
                  if (pos != sel) select(pos) else activate()
              }

              private fun activate() {
                  val g = current()
                  if (g == null) pickInstalledApp() else launch(g)
              }

              private fun launch(g: Game) {
                  val i = packageManager.getLaunchIntentForPackage(g.pkg)
                  if (i == null) { toast("${g.name} ya no está instalado"); return }
                  g.last = System.currentTimeMillis()
                  Store.save(this, games)
                  startActivity(i)
              }

              // ---------- Agregar / eliminar ----------
              private fun pickInstalledApp() {
                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(intent, 0)
                      .map { it.activityInfo.packageName to it.loadLabel(pm).toString() }
                      .filter { it.first != packageName && games.none { g -> g.pkg == it.first } }
                      .distinctBy { it.first }
                      .sortedBy { it.second.lowercase() }
                  if (apps.isEmpty()) { toast("No hay más apps para agregar"); return }
                  AlertDialog.Builder(this)
                      .setTitle("Elige el juego instalado")
                      .setItems(apps.map { it.second }.toTypedArray()) { _, w -> askName(apps[w].first, apps[w].second) }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun askName(pkg: String, label: String) {
                  val et = EditText(this).apply { setText(label); setSelectAllOnFocus(true) }
                  AlertDialog.Builder(this)
                      .setTitle("Nombre del juego")
                      .setView(et)
                      .setPositiveButton("Elegir carátula") { _, _ ->
                          pendingPkg = pkg
                          pendingName = et.text.toString().ifBlank { label }
                          pickCover.launch("image/*")
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun confirmDelete(g: Game) {
                  AlertDialog.Builder(this)
                      .setTitle("¿Quitar ${g.name} del launcher?")
                      .setMessage("No se desinstala el juego.")
                      .setPositiveButton("Quitar") { _, _ ->
                          Store.deleteFile(g.cover)
                          games.remove(g)
                          Store.save(this, games)
                          sel = (sel - 1).coerceAtLeast(0)
                          refresh()
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              // ---------- Pestanas ----------
              private fun setTab(t: Tab) { tab = t; sel = 0; styleTabs(); refresh() }

              private fun styleTabs() {
                  val map = mapOf(R.id.tabRecent to Tab.RECENT, R.id.tabFav to Tab.FAV, R.id.tabAll to Tab.ALL)
                  map.forEach { (id, t) ->
                      findViewById<View>(id).setBackgroundResource(if (t == tab) R.drawable.tab_on else 0)
                  }
              }

              // ---------- Control / teclado ----------
              override fun onKeyDown(k: Int, e: KeyEvent): Boolean {
                  when (k) {
                      KeyEvent.KEYCODE_DPAD_RIGHT -> { move(1); return true }
                      KeyEvent.KEYCODE_DPAD_LEFT -> { move(-1); return true }
                      KeyEvent.KEYCODE_BUTTON_A, KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { activate(); return true }
                  }
                  return super.onKeyDown(k, e)
              }

              override fun onGenericMotionEvent(e: MotionEvent): Boolean {
                  if ((e.source and InputDevice.SOURCE_JOYSTICK) != 0 && e.action == MotionEvent.ACTION_MOVE) {
                      var x = e.getAxisValue(MotionEvent.AXIS_HAT_X)
                      if (x == 0f) x = e.getAxisValue(MotionEvent.AXIS_X)
                      val d = if (x > 0.6f) 1 else if (x < -0.6f) -1 else 0
                      if (d != 0 && hatHeld == 0) move(d)
                      hatHeld = d
                      return true
                  }
                  return super.onGenericMotionEvent(e)
              }

              // ---------- Sonido de inicio ----------
              private fun soundOn() = getSharedPreferences("cfg", 0).getBoolean("sound", true)

              private fun playStartup() {
                  if (!soundOn()) return
                  try {
                      val mp = MediaPlayer.create(this, R.raw.startup)
                      mp?.setOnCompletionListener { it.release() }
                      mp?.start()
                  } catch (_: Exception) {}
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
          }

          class GameAdapter(private val onClick: (Int) -> Unit) : RecyclerView.Adapter<GameAdapter.VH>() {
              var items: List<Game> = emptyList()
              var selected = 0

              class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val cover: ImageView = v.findViewById(R.id.cover)
                  val add: TextView = v.findViewById(R.id.add)
                  val name: TextView = v.findViewById(R.id.name)
                  val border: View = v.findViewById(R.id.border)
              }

              override fun getItemCount() = items.size + 1
              override fun onCreateViewHolder(p: ViewGroup, t: Int) =
                  VH(LayoutInflater.from(p.context).inflate(R.layout.item_game, p, false))

              override fun onBindViewHolder(h: VH, pos: Int) {
                  val isAdd = pos == items.size
                  if (isAdd) {
                      h.add.visibility = View.VISIBLE; h.name.text = ""; h.cover.setImageBitmap(null)
                  } else {
                      val g = items[pos]
                      h.add.visibility = View.GONE; h.name.text = g.name; h.cover.setImageBitmap(Store.bitmap(g.cover))
                  }
                  val on = pos == selected
                  h.border.visibility = if (on) View.VISIBLE else View.GONE
                  h.itemView.animate().scaleX(if (on) 1.15f else 1f).scaleY(if (on) 1.15f else 1f).setDuration(150).start()
                  h.itemView.elevation = if (on) 12f else 0f
                  h.itemView.setOnClickListener { onClick(h.bindingAdapterPosition) }
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/mylauncher/gamer/ParticlesView.kt <<'EOF_FILE'
          package com.mylauncher.gamer

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.View
          import kotlin.random.Random

          /** Particulas brillantes (cian y rojo) que flotan hacia arriba. */
          class ParticlesView @JvmOverloads constructor(c: Context, a: AttributeSet? = null) : View(c, a) {
              private class P(var x: Float, var y: Float, val r: Float, val v: Float, val col: Int, val alpha: Int)

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val density = resources.displayMetrics.density
              private val ps = List(45) {
                  P(Random.nextFloat(), Random.nextFloat(), Random.nextFloat() * 2f + 0.8f, Random.nextFloat() * 0.0035f + 0.001f,
                      if (Random.nextFloat() < 0.65f) Color.rgb(25, 211, 255) else Color.rgb(255, 45, 85),
                      (Random.nextFloat() * 150 + 70).toInt())
              }

              override fun onDraw(canvas: Canvas) {
                  for (p in ps) {
                      p.y -= p.v
                      if (p.y < 0f) { p.y = 1f; p.x = Random.nextFloat() }
                      paint.color = p.col
                      paint.alpha = p.alpha / 4
                      canvas.drawCircle(p.x * width, p.y * height, p.r * density * 3f, paint)
                      paint.alpha = p.alpha
                      canvas.drawCircle(p.x * width, p.y * height, p.r * density, paint)
                  }
                  postInvalidateOnAnimation()
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/mylauncher/gamer/Store.kt <<'EOF_FILE'
          package com.mylauncher.gamer

          import android.content.Context
          import android.graphics.*
          import android.net.Uri
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import kotlin.math.max

          data class Game(
              val pkg: String,
              var name: String,
              var cover: String,
              var fav: Boolean = false,
              var last: Long = 0L
          )

          object Store {
              private val cache = HashMap<String, Bitmap?>()

              fun load(ctx: Context): MutableList<Game> {
                  val out = mutableListOf<Game>()
                  try {
                      val arr = JSONArray(ctx.getSharedPreferences("games", 0).getString("list", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(Game(o.getString("pkg"), o.getString("name"), o.getString("cover"), o.optBoolean("fav"), o.optLong("last")))
                      }
                  } catch (_: Exception) {}
                  return out
              }

              fun save(ctx: Context, list: List<Game>) {
                  val arr = JSONArray()
                  list.forEach {
                      arr.put(JSONObject().put("pkg", it.pkg).put("name", it.name).put("cover", it.cover)
                          .put("fav", it.fav).put("last", it.last))
                  }
                  ctx.getSharedPreferences("games", 0).edit().putString("list", arr.toString()).apply()
              }

              fun bitmap(path: String): Bitmap? = cache.getOrPut(path) { BitmapFactory.decodeFile(path) }

              fun deleteFile(path: String) { cache.remove(path); File(path).delete() }

              /** Recorta la imagen a formato vertical 2:3 y la guarda en el almacenamiento interno. */
              fun saveCover(ctx: Context, uri: Uri, key: String): String? {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                  var s = 1
                  while (bounds.outWidth / s > 1200) s *= 2
                  val opts = BitmapFactory.Options().apply { inSampleSize = s }
                  val src = ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null
                  val w = 400; val h = 600
                  val scale = max(w / src.width.toFloat(), h / src.height.toFloat())
                  val m = Matrix().apply {
                      postScale(scale, scale)
                      postTranslate((w - src.width * scale) / 2f, (h - src.height * scale) / 2f)
                  }
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  Canvas(out).drawBitmap(src, m, Paint(Paint.FILTER_BITMAP_FLAG))
                  val f = File(ctx.filesDir, "cover_${key}_${System.currentTimeMillis()}.jpg")
                  FileOutputStream(f).use { out.compress(Bitmap.CompressFormat.JPEG, 85, it) }
                  return f.absolutePath
              }
          }
