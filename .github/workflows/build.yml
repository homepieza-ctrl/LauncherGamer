          cat > tools/make_startup_sound.py <<'EOF_FILE'
          import wave, math, struct, os, sys
          SR = 22050
          DUR = 5.0
          N = int(SR * DUR)
          buf = [0.0] * N
          TAU = 2 * math.pi

          # Acorde etereo (Re mayor add9) que crece lento
          voices = [(73.42, 0.0, 0.30), (110.0, 0.15, 0.26), (146.83, 0.30, 0.22), (185.0, 0.45, 0.18),
                    (220.0, 0.60, 0.16), (293.66, 0.80, 0.12), (329.63, 1.00, 0.10), (440.0, 1.20, 0.08)]
          for f, st, amp in voices:
              for i in range(int(st * SR), N):
                  t = i / SR - st
                  e = min(1.0, t / 1.5) * math.exp(-max(0.0, t - 1.9) * 0.6)
                  v = (math.sin(TAU * f * t) + 0.5 * math.sin(TAU * f * 1.003 * t)
                       + 0.30 * math.sin(TAU * f * 2 * t + 0.4) + 0.12 * math.sin(TAU * f * 3 * t))
                  buf[i] += amp * e * v

          # Destellos tipo campana
          for f, st in [(1174.66, 1.55), (1479.98, 1.85), (1760.0, 2.15), (2349.3, 2.45)]:
              for i in range(int(st * SR), N):
                  t = i / SR - st
                  e = math.exp(-t * 2.6) * min(1.0, t / 0.01)
                  v = math.sin(TAU * f * t) + 0.4 * math.sin(TAU * f * 2.76 * t)
                  buf[i] += 0.07 * e * v

          # Reverb simple (peines)
          wet = [0.0] * N
          for d, g in [(0.0297, 0.72), (0.0371, 0.70), (0.0411, 0.68), (0.0437, 0.66)]:
              D = int(d * SR)
              line = [0.0] * N
              for i in range(N):
                  x = buf[i] + (line[i - D] * g if i >= D else 0.0)
                  line[i] = x
                  wet[i] += x * 0.22
          out = [buf[i] * 0.6 + wet[i] for i in range(N)]

          # Fundido final + normalizar
          fade = int(0.7 * SR)
          for i in range(fade):
              out[N - 1 - i] *= i / fade
          peak = max(abs(x) for x in out) or 1.0
          out = [x / peak * 0.85 for x in out]

          path = sys.argv[1] if len(sys.argv) > 1 else "startup.wav"
          os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
          with wave.open(path, "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
              w.writeframes(b"".join(struct.pack("<h", int(x * 32767)) for x in out))
          print("Sonido creado:", path)
          EOF_FILE

      - name: Generar sonido de inicio
        run: python3 tools/make_startup_sound.py app/src/main/res/raw/startup.wav

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
